<!DOCTYPE html>
<html xmlns:th="http://thymeleaf.org" lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login - Associação de Moradores</title>
</head>
<body>

<main role="main">
    <section aria-labelledby="login-title">
        <h1 id="login-title">Acessar o Sistema</h1>

        <!-- Alertas de erro de autenticação acessíveis via aria-live -->
        <div th:if="${param.error}" role="alert" aria-live="assertive" style="color: #d32f2f;">
            <p>Usuário ou senha incorretos. Por favor, tente novamente.</p>
        </div>

        <div th:if="${param.logout}" role="status" aria-live="polite" style="color: #388e3c;">
            <p>Você saiu do sistema com sucesso.</p>
        </div>

        <form th:action="@{/login}" method="post">
            <div>
                <!-- Associação estrita usando 'for' e 'id' -->
                <label id="label-username" for="username">Nome de Usuário ou E-mail:</label>
                <input type="text" id="username" name="username" required
                       aria-required="true" autocomplete="username">
            </div>

            <div>
                <label id="label-password" for="password">Senha:</label>
                <input type="password" id="password" name="password" required
                       aria-required="true" autocomplete="current-password">
            </div>

            <div>
                <button type="submit" aria-label="Entrar no painel do sistema">Entrar</button>
            </div>
        </form>
    </section>
</main>

</body>
</html>
