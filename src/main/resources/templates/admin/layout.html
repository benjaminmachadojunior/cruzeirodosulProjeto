<!DOCTYPE html>
<html xmlns:th="http://thymeleaf.org" lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title th:text="${title} ? ${title} + ' - Painel Associação' : 'Painel Administrativo'"></title>
    <!-- Estilo básico focado em acessibilidade visual -->
    <style>
        .skip-link {
            position: absolute;
            top: -40px;
            left: 0;
            background: #000;
            color: #fff;
            padding: 8px;
            z-index: 100;
            transition: top 0.2s;
        }
        .skip-link:focus {
            top: 0;
        }
        nav a:focus, button:focus, input:focus, select:focus, textarea:focus {
            outline: 3px solid #0056b3;
            outline-offset: 2px;
        }
    </style>
</head>
<body>

<!-- Link de salto para usuários de teclado pularem o menu direto para o conteúdo -->
<a href="#conteudo-principal" class="skip-link">Pular para o conteúdo principal</a>

<header role="banner">
    <h1>Associação de Moradores - Área Administrativa</h1>

    <!-- Navegação Principal com atributos ARIA -->
    <nav role="navigation" aria-label="Menu Principal">
        <ul>
            <li><a th:href="@{/admin/dashboard}">Início</a></li>
            <li><a th:href="@{/admin/solicitacoes}">Solicitações</a></li>
            <li><a th:href="@{/admin/usuarios}">Moradores</a></li>
            <li>
                <form th:action="@{/logout}" method="post" style="display:inline;">
                    <button type="submit" aria-label="Encerrar sessão no sistema">Sair</button>
                </form>
            </li>
        </ul>
    </nav>
</header>

<!-- Conteúdo Dinâmico injetado pelas páginas filhas -->
<main id="conteudo-principal" role="main" tabindex="-1">
    <div th:replace="${content}">
        <!-- Conteúdo específico de cada tela aparecerá aqui -->
    </div>
</main>

<footer role="contentinfo">
    <p>&copy; 2026 Associação de Moradores. Todos os direitos reservados para a acessibilidade digital.</p>
</footer>

</body>
</html>
