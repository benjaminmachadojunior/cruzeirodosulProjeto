<!DOCTYPE html>
<html xmlns:th="http://thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Solicitações</title>
</head>
<body>
<div th:fragment="content">
    <h2>Lista de Solicitações</h2>
    <table border="1">
        <thead>
        <tr>
            <th>ID</th>
            <th>Descrição</th>
            <th>Status</th>
            <th>Ações</th>
        </tr>
        </thead>
        <tbody>
        <tr th:each="s : ${solicitacoes}">
            <td th:text="${s.id}">1</td>
            <td th:text="${s.descricao}">Descrição</td>
            <td th:text="${s.status}">PENDENTE</td>
            <td>
                <a th:href="@{/admin/solicitacoes/editar/{id}(id=${s.id})}">Editar</a>
            </td>
        </tr>
        </tbody>
    </table>
</div>
</body>
</html>
