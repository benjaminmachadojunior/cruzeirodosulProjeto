<!DOCTYPE html>
<html xmlns:th="http://thymeleaf.org" lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <title>Editar Solicitação</title>
</head>
<body>

<div th:fragment="content">
    <h2>Atualizar Solicitação</h2>

    <!-- Formulário mapeado para o objeto Solicitacao no Model do Spring -->
    <form th:action="@{/admin/solicitacoes/salvar}" th:object="${solicitacao}" method="post">

        <!-- Campo oculto para controle do ID -->
        <input type="hidden" th:field="*{id}" />

        <div>
            <label for="campo-morador">Nome do Solicitante:</label>
            <!-- Campo desabilitado mantendo a leitura clara -->
            <input type="text" id="campo-morador" th:value="*{morador.nome}" readonly aria-readonly="true">
        </div>

        <div>
            <label for="campo-descricao">Detalhamento do Problema:</label>
            <textarea id="campo-descricao" th:field="*{descricao}" rows="4" required aria-required="true"
                      th:aria-invalid="${#fields.hasErrors('descricao')} ? 'true' : 'false'"
                      aria-describedby="erro-descricao"></textarea>

            <!-- Feedback instantâneo de erro de validação -->
            <span id="erro-descricao" role="alert" aria-live="assertive" style="color: #d32f2f;"
                  th:if="${#fields.hasErrors('descricao')}" th:errors="*{descricao}">
                    A descrição precisa ter o tamanho correto.
                </span>
        </div>

        <div>
            <label for="campo-status">Situação/Status:</label>
            <select id="campo-status" th:field="*{status}" required aria-required="true">
                <option value="PENDENTE">Análise Pendente</option>
                <option value="EM_ANDAMENTO">Em Atendimento</option>
                <option value="CONCLUIDO">Resolvido/Concluído</option>
                <option value="REJEITADO">Não Aprovado</option>
            </select>
        </div>

        <div style="margin-top: 15px;">
            <button type="submit" aria-label="Salvar alterações do chamado">Confirmar Atualização</button>
            <a th:href="@{/admin/solicitacoes}" aria-label="Cancelar edição e voltar para a listagem">Voltar</a>
        </div>
    </form>
</div>

</body>
</html>
