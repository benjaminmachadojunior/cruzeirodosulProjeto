<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{admin/layout :: head('Editar Solicitação')}"></head>
<body>
<div class="container-fluid">
    <div class="row">
        <!-- Barra lateral padrão do sistema -->
        <div th:replace="~{admin/layout :: sidebar('solicitacoes')}"></div>

        <!-- Conteúdo Principal -->
        <main class="col-md-9 ms-sm-auto col-lg-10 px-md-4 py-4">
            <h1 class="mb-4">Editar Solicitação</h1>

            <div class="card shadow-sm">
                <div class="card-body">
                    <form th:action="@{/admin/solicitacoes/editar/{id}(id=${solicitacao.id})}" th:object="${solicitacao}" method="post">

                        <!-- ID Oculto para garantir a atualização correta -->
                        <input type="hidden" th:field="*{id}" />

                        <!-- Morador (Apenas Leitura) -->
                        <div class="mb-3">
                            <label class="form-label fw-bold">Morador</label>
                            <input type="text" th:value="${solicitacao.morador != null ? solicitacao.morador.nome : 'Não informado'}" class="form-control bg-light" readonly disabled/>
                        </div>

                        <!-- Endereço -->
                        <div class="mb-3">
                            <label for="endereco" class="form-label fw-bold">Endereço</label>
                            <input type="text" th:field="*{endereco}" id="endereco" class="form-control" required/>
                        </div>

                        <!-- Criticidade -->
                        <div class="mb-3">
                            <label for="criticidade" class="form-label fw-bold">Criticidade (0 a 99)</label>
                            <input type="number" th:field="*{criticidade}" id="criticidade" min="0" max="99" class="form-control" required/>
                        </div>

                        <!-- Campo de Seleção Customizado para Status (Estilo Botão de Rádio) -->
                        <div class="mb-3">
                            <label class="form-label fw-bold" style="color: #212529 !important;">Status da Solicitação</label>
                            <div class="card bg-white border p-2">
                                <!-- Opção PENDENTE -->
                                <div class="form-check p-2 border-bottom border-light d-flex align-items-center">
                                    <input class="form-check-input ms-1 me-3" type="radio" th:field="*{status}" id="status_pendente" value="PENDENTE" required />
                                    <label class="form-check-label text-dark fw-normal" for="status_pendente" style="color: #212529 !important; cursor: pointer;">
                                        Pendente
                                    </label>
                                </div>
                                <!-- Opção EM ANÁLISE -->
                                <div class="form-check p-2 border-bottom border-light d-flex align-items-center">
                                    <input class="form-check-input ms-1 me-3" type="radio" th:field="*{status}" id="status_analise" value="EM_ANÁLISE" />
                                    <label class="form-check-label text-dark fw-normal" for="status_analise" style="color: #212529 !important; cursor: pointer;">
                                        Em Análise
                                    </label>
                                </div>
                                <!-- Opção RESOLVIDO -->
                                <div class="form-check p-2 d-flex align-items-center">
                                    <input class="form-check-input ms-1 me-3" type="radio" th:field="*{status}" id="status_resolvido" value="RESOLVIDO" />
                                    <label class="form-check-label text-dark fw-normal" for="status_resolvido" style="color: #212529 !important; cursor: pointer;">
                                        Resolvido
                                    </label>
                                </div>
                            </div>
                        </div>

                        <!-- Campo de Descrição com trava física de digitação -->
                        <div class="mb-4">
                            <label for="descricao" class="form-label fw-bold">Descrição</label>
                            <textarea th:field="*{descricao}" id="descricao" maxlength="1000" class="form-control" rows="4" required></textarea>
                        </div>

                        <!-- Botões de Ação Alinhados -->
                        <div class="d-flex gap-2">
                            <button type="submit" class="btn btn-warning px-4">Salvar Alterações</button>
                            <a th:href="@{/admin/solicitacoes}" class="btn btn-secondary px-4">Cancelar</a>
                        </div>
                    </form>
                </div>
            </div>
        </main>
    </div>
</div>
</body>
</html>
